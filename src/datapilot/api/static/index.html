<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DataPilot AI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { margin-bottom: 0.2rem; }
  .sub { color: #666; margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  .status-success { color: #1a7f37; font-weight: 600; }
  .status-failed { color: #cf222e; font-weight: 600; }
  button { cursor: pointer; padding: 0.3rem 0.7rem; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; }
  #incident { white-space: pre-wrap; background: #f6f8fa; padding: 1rem; border-radius: 6px; font-size: 0.85rem; }
  #timeline li { margin-bottom: 0.3rem; font-size: 0.85rem; }
  #observability {
    background: #f6f8fa;
    padding: 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  .trace-event {
    padding: 0.6rem;
    margin-bottom: 0.5rem;
    border-left: 3px solid #999;
    background: #fff;
  }
  .trace-agent {
    font-weight: 600;
  }
  .trace-type {
    color: #666;
    font-size: 0.8rem;
  }
  .trace-data {
    margin-top: 0.35rem;
    white-space: pre-wrap;
    overflow-x: auto;
  }  

</style>
</head>
<body>
  <h1>DataPilot AI</h1>
  <p class="sub">Pipeline health, incidents, and AI investigations.</p>

  <h2>Pipeline Health</h2>
  <table id="health"><thead><tr><th>Pipeline</th><th>Status</th><th>Batch</th><th>Records</th><th></th></tr></thead>
    <tbody></tbody></table>

  <h2>Investigation</h2>
  <div id="incident">Select a failed run above to investigate.</div>
  <h3>Timeline</h3>
  <ul id="timeline"></ul>

  <h3>Agent Observability</h3>
  <div id="observability">Run an investigation to see agent tool activity.</div>
<script>
async function loadHealth() {
  const res = await fetch('/pipelines');
  const rows = await res.json();
  const body = document.querySelector('#health tbody');
  body.innerHTML = '';
  for (const row of rows) {
    const run = row.latest_run;
    const tr = document.createElement('tr');
    if (!run) {
      tr.innerHTML = `<td>${row.pipeline_name}</td><td colspan="4">No runs yet</td>`;
    } else {
      const cls = run.status === 'success' ? 'status-success' : 'status-failed';
      const btn = run.status === 'failed'
        ? `<button onclick="investigate('${run.run_id}','${row.pipeline_name}','${run.batch_date}')">Investigate</button>`
        : '';
      tr.innerHTML = `<td>${row.pipeline_name}</td><td class="${cls}">${run.status.toUpperCase()}</td>` +
        `<td>${run.batch_date}</td><td>${run.records_processed ?? '-'}</td><td>${btn}</td>`;
    }
    body.appendChild(tr);
  }
}

async function investigate(runId, pipelineName, batchDate) {
  document.getElementById('incident').textContent = 'Investigating... (agents are calling their tools)';

  const res = await fetch('/investigate', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({run_id: runId, pipeline_name: pipelineName, batch_date: batchDate}),
  });
  const data = await res.json();
  document.getElementById('incident').textContent = JSON.stringify(data.diagnosis, null, 2);
  const observability = document.getElementById('observability');
  observability.innerHTML = '';

  for (const event of (data.tool_trace || [])) {
    const div = document.createElement('div');
    div.className = 'trace-event';

    const agent = event.agent ?? 'unknown agent';
    const type = event.type ?? 'unknown';

    let details = '';

    if (type === 'call') {
      details = JSON.stringify(event.args ?? {}, null, 2);
    } else if (type === 'response') {
      details = JSON.stringify(event.response ?? {}, null, 2);
    }

    div.innerHTML =
      `<div class="trace-agent">${agent}</div>` +
      `<div class="trace-type">${type} · ${event.tool ?? ''}</div>` +
      `<div class="trace-data">${details}</div>`;

    observability.appendChild(div);
  }

  const inc = await fetch(`/incidents/${runId}`);
  if (inc.ok) {
    const incData = await inc.json();
    const tl = document.getElementById('timeline');
    tl.innerHTML = '';
    for (const ev of incData.timeline) {
      const li = document.createElement('li');
      li.textContent = `${ev.time ?? '?'} — ${ev.text}`;
      tl.appendChild(li);
    }
  }
}

loadHealth();
</script>
</body>
</html>
