# Day 3: local Airflow
services:
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    env_file: .env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "False"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION}
      BQ_LOCATION: ${BQ_LOCATION}
      DATAPILOT_DATA_DIR: /opt/datapilot-data
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcp-adc/application_default_credentials.json

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
      - ./data:/opt/datapilot-data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./scripts}:/opt/gcp-creds:ro
      - ./configs:/opt/airflow/configs
      - ${APPDATA}/gcloud/application_default_credentials.json:/opt/gcp-adc/application_default_credentials.json:ro

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com
        --password admin 2>/dev/null || true;
      airflow scheduler &
      exec airflow webserver
      "

volumes:
  airflow_data: